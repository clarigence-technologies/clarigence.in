# Enable shared JDBC sessions for the autoscaling Vercel backend.
spring.autoconfigure.exclude=
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
# Bound the connections used by each backend instance.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
# Enquiries are stored for the authenticated admin; no email provider is needed.
clarigence.enquiry-email.enabled=false
