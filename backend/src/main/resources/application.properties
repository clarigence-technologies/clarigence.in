spring.application.name=clarigence-contact-api
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Keep local/container sessions unchanged unless the vercel profile is enabled.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
server.port=${SERVER_PORT:${PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clarigence?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:clarigence_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-binding-errors=never

# Enable only after configuring SMTP credentials on the backend host.
clarigence.enquiry-email.enabled=${ENQUIRY_EMAIL_ENABLED:false}
clarigence.enquiry-email.provider=${ENQUIRY_EMAIL_PROVIDER:smtp}
clarigence.enquiry-email.resend-api-key=${RESEND_API_KEY:}
clarigence.enquiry-email.to=${ENQUIRY_EMAIL_TO:hello@clarigence.in}
clarigence.enquiry-email.from=${ENQUIRY_EMAIL_FROM:${SMTP_USERNAME:}}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
