# Production must use explicit database settings supplied by the host.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

CORS_ALLOWED_ORIGINS=https://www.clarigence.in,https://clarigence.in
SESSION_COOKIE_SECURE=true

# The hosting proxy terminates HTTPS before forwarding to the container over HTTP.
# Preserve the external scheme/host so same-origin admin writes pass CORS checks.
server.forward-headers-strategy=framework
