services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clarigence
      MYSQL_USER: clarigence_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://database:3306/clarigence?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: clarigence_app
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://clarigence.in,https://www.clarigence.in
      SESSION_COOKIE_SECURE: 'true'
      SPRING_PROFILES_ACTIVE: production
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  mysql-data:
