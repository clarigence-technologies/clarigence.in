# Clarigence website (static files) + Java backend (/api, /admin) on one Hostinger VPS.
# Certbot adds the HTTPS (443) server block and the HTTP -> HTTPS redirect to this file.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name clarigence.in www.clarigence.in _;

  root /var/www/clarigence/public;
  index index.html;
  client_max_body_size 6m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;

  # Same redirects as the previous Vercel configuration.
  location = /index { return 301 /; }
  location = /index.html { return 301 /; }
  location = /home { return 301 /; }

  location = /admin {
    proxy_pass http://127.0.0.1:8080;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8080;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Versioned CSS/JS (?v=hash) and images can be cached; HTML and config stay fresh.
  location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|avif|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /api-config.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Clean URLs: /about serves about.html; /about.html redirects to /about.
  location ~ ^/(.+)\.html$ { return 301 /$1$is_args$args; }
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
