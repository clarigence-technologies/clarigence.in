# HTTP-only site for a new server (no certificate yet).
# After DNS points here, issue the certificate with the webroot method (see HOSTINGER-DEPLOYMENT.md);
# the next deploy.sh run then installs nginx-clarigence-ssl.conf.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name clarigence.in www.clarigence.in _;
  location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
  include snippets/clarigence-locations.conf;
}
