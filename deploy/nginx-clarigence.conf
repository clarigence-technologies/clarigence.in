server {
  listen 80;
  listen [::]:80;
  server_name clarigence.in www.clarigence.in;

  root /var/www/clarigence/public;
  index index.html;
  client_max_body_size 6m;

  location = /admin {
    proxy_pass http://127.0.0.1:8080;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8080;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
