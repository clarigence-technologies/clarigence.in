# HTTPS site, used when /etc/letsencrypt/live/clarigence.in exists.
# Domain over HTTP: certificate renewal files (certbot webroot), everything else to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name clarigence.in www.clarigence.in;
  server_tokens off;
  location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
  location / { return 301 https://$host$request_uri; }
}

# Plain IP access (for checks) serves the site directly.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  include snippets/clarigence-locations.conf;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name clarigence.in www.clarigence.in;

  ssl_certificate /etc/letsencrypt/live/clarigence.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clarigence.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;

  include snippets/clarigence-locations.conf;
}
